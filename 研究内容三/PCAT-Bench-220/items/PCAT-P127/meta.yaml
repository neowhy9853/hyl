patch_subject: '  *) mod_http2: field values (headers and trailers) are stripped of      leading/trailing
  whitespace (space +htab) before being processed      or send in a response. This
  is compatible behaviour to HTTP/1.1      parsers that strip incoming headers of
  such characters.      [Stefan Eissing]'

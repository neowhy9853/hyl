ground_truth:
  confidence: high
  summary: The commit describes a userspace-visible sysfs/configfs lifetime regression
    and DHCP breakage caused by the old topology.
  old_contract: The net_device remained parented to a configfs instance whose lifetime
    could end first, leaving stale sysfs linkage.
  new_contract: device_move reparents the net_device to the gadget device and keeps
    the interface visible under the live device hierarchy.
  static_evidence:
  - file: drivers/usb/gadget/function/f_ncm.c

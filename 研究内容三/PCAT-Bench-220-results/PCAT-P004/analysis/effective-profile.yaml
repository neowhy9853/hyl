  "compatibility_types": [
    "API_SIGNATURE_CHANGE: Function, method, command, or exported interface signature changed",
    "ABI_CHANGE: Binary ABI, layout, exported symbol, enum, macro, or versioned symbol changed",
    "INPUT_CONTRACT_CHANGE: Accepted input, validation, range, required field, or flag semantics changed",
    "RETURN_CONTRACT_CHANGE: Return value, errno, exception, status, or output-buffer contract changed",
    "ERROR_EXCEPTION_CHANGE: Error code, exception type, diagnostic behavior, or failure path changed",
    "SIDE_EFFECT_CHANGE: Observable state, file, network, resource, cache, or permission side effect changed",
    "OUTPUT_FORMAT_CHANGE: CLI, log, protocol text, structured output, or file format changed",
    "PROC_SYS_OUTPUT_CHANGE: /proc, /proc/sys, or /sys output or attribute semantics changed",
    "SYSCALL_SEMANTIC_CHANGE: Syscall number, argument, flag, errno, compat, blocking, or timeout semantics changed",
    "IOCTL_NETLINK_ABI_CHANGE: ioctl command or netlink family/operation/attribute/policy ABI changed",
    "CONFIG_CLI_BEHAVIOR_CHANGE: CLI option, config key, environment variable, default, or parsing behavior changed",
    "RESOURCE_LIFETIME_CHANGE: Memory, fd, reference count, lock, object ownership, or cleanup lifetime changed",
    "PERFORMANCE_RESOURCE_SEMANTIC_CHANGE: Timeout, retry, limit, ordering, batching, or resource consumption semantics changed",
    "API_SIGNATURE_CHANGE: Kernel exported function or UAPI prototype change",
    "ABI_CHANGE: UAPI struct layout, enum, macro, symbol, or binary ABI change",
    "INPUT_CONTRACT_CHANGE: Input validation or accepted flag/range change",
    "RETURN_CONTRACT_CHANGE: Return value or output buffer contract change",
    "ERROR_EXCEPTION_CHANGE: errno or diagnostic behavior change",
    "SIDE_EFFECT_CHANGE: Observable state, namespace, permission, or resource side effect change",
    "OUTPUT_FORMAT_CHANGE: Generic visible text/binary output change",
    "PROC_SYS_OUTPUT_CHANGE: /proc, /proc/sys, or /sys entry output/attribute change",
    "SYSCALL_SEMANTIC_CHANGE: syscall number, argument, errno, flag, compat, blocking, or timeout semantic change",
    "IOCTL_NETLINK_ABI_CHANGE: ioctl command or netlink family/attribute/policy ABI change",
    "CONFIG_CLI_BEHAVIOR_CHANGE: Kconfig, module parameter, or tool behavior change",
    "RESOURCE_LIFETIME_CHANGE: reference count, fd, memory, lock, or lifetime change",
    "PERFORMANCE_RESOURCE_SEMANTIC_CHANGE: timeout, retry, limit, or resource consumption semantic change"
  ],

        "test/**",
        "tests/**",
        "t/**",
        "spec/**",
        "testing/**",
        "**/*_test.*",
        "**/test_*"
      ],
      "public": false,
      "test_priority": "low",
      "description": "Test-only files. Use as reachability evidence, not as public API by itself."
    },
    "docs": {
      "paths": [
        "doc/**",
        "docs/**",
        "Documentation/**",
        "man/**",
        "README*",
        "CHANGELOG*",
        "NEWS*"
      ],

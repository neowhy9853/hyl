analysis_policy:
  callgraph_after_findings_only: true
  evidence_required: true
  final_findings_only_confirmed: true
  semantic_dimensions:
  - signature
  - input_contract
  - return_contract
  - error_contract
  - side_effect
  - output_format
  - resource_lifetime
  - timeout_retry
api_surfaces:
  c_api:
    description: CPython C API
    paths:
    - Include/**
    - Include/**/*.h
    patterns:
    - PyAPI_FUNC
    - PyAPI_DATA
    test_priority: high
  callbacks:
    description: Callback types and callback invocation semantics.
    patterns:
    - callback
    - cb_
    - _cb
    - '*callback*'
    public: true
    semantic_dimensions:
    - signature
    - resource_lifetime
    - side_effect
    stability: semi_stable
    test_priority: high
  cli:
    description: Command-line interface behavior
    paths:
    - Modules/main.c
    - Lib/**/__main__.py
    test_priority: medium
  cli_options:
    description: CLI commands, options, parsing, defaults, exit codes, and output.
    paths:
    - src/*main*
    - src/**/main.*
    - tools/**
    - cli/**
    - builtin/**
    - cmd/**
    patterns:
    - getopt
    - getopt_long
    - argparse
    - argp_parse
    - parse_options
    - OPT_
    - command
    - subcommand
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - output_format
    - side_effect
    stability: stable
    test_priority: high
  config_files:
    description: Configuration formats, build options, and defaults.
    paths:
    - '**/*.conf*'
    - '**/*.cfg*'
    - '**/*.ini*'
    - '**/Kconfig*'
    - Makefile
    - CMakeLists.txt
    - meson_options.txt
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - output_format
    test_priority: medium
  config_keys:
    description: Configuration keys, parsing behavior, defaults, and diagnostics.
    paths:
    - '**/*config*'
    - '**/*.conf*'
    - '**/*.ini*'
    - '**/*.cfg*'
    patterns:
    - config
    - parse_config
    - read_config
    - git_config
    - repo_config
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - error_contract
    - side_effect
    stability: stable
    test_priority: high
  deprecation:
    description: Deprecation and warning changes
    patterns:
    - DeprecationWarning
    - PendingDeprecationWarning
    - FutureWarning
    - '@deprecated'
    - __deprecated__
    test_priority: medium
  docs:
    description: Documentation and release notes. Use for contract evidence only.
    paths:
    - doc/**
    - docs/**
    - Documentation/**
    - man/**
    - README*
    - CHANGELOG*
    - NEWS*
    public: false
    test_priority: low
  environment_variables:
    description: Environment-variable configuration behavior.
    patterns:
    - getenv
    - secure_getenv
    - setenv
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - side_effect
    stability: stable
    test_priority: medium
  exceptions:
    description: Exception type and message changes
    patterns:
    - PyExc_
    - raise
    - ValueError
    - TypeError
    - RuntimeError
    - OSError
    test_priority: high
  exported_symbols:
    description: Shared-library or module-exported symbols.
    files:
    - '*.map'
    - '*.symver'
    - '*.sym'
    - '*.symbols'
    - '*.def'
    - '*.exports'
    patterns:
    - __declspec(dllexport)
    - __attribute__((visibility("default")))
    - EXPORT_SYMBOL
    - EXPORT_SYMBOL_GPL
    - EXPORT_SYMBOL_NS
    public: true
    semantic_dimensions:
    - signature
    - abi_symbol
    - return_contract
    stability: stable
    test_priority: high
  ioctl_netlink_consumers:
    description: ioctl and netlink ABI consumers or producers.
    patterns:
    - ioctl
    - _IO
    - _IOR
    - _IOW
    - _IOWR
    - NETLINK_
    - nla_
    - genl_
    public: true
    semantic_dimensions:
    - input_contract
    - abi_layout
    - return_contract
    stability: stable
    test_priority: high
  pkgconfig:
    description: Build metadata consumed by external projects.
    files:
    - '*.pc'
    - '*.pc.in'
    - '*Config.cmake'
    - '*Targets.cmake'
    public: true
    semantic_dimensions:
    - build_surface
    - dependency_contract
    stability: stable
    test_priority: high
  proc_sys_consumers:
    description: User-space parsers or generators for /proc, /proc/sys, or /sys text
      output.
    patterns:
    - /proc/
    - /sys/
    - procfs
    - sysfs
    - sysctl
    - fscanf
    - sscanf
    - getline
    - readdir
    public: true
    semantic_dimensions:
    - output_format
    - input_contract
    - error_contract
    stability: semi_stable
    test_priority: medium
  public_headers:
    description: Public C/C++ headers and declarations.
    exclude:
    - test/**
    - tests/**
    - t/**
    - private/**
    - internal/**
    paths:
    - include/**
    - src/include/**
    - lib*/include/**
    - api/**
    - '**/*.h'
    public: true
    semantic_dimensions:
    - signature
    - abi_layout
    - input_contract
    - return_contract
    stability: stable
    test_priority: high
  python_cli:
    description: Python command-line entrypoints and exit behavior.
    paths:
    - '**/__main__.py'
    - bin/**
    - scripts/**
    patterns:
    - argparse
    - click
    - optparse
    - sys.argv
    - sys.exit
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - output_format
    stability: stable
    test_priority: medium
  python_exceptions:
    description: Exception type, message, and failure-path compatibility.
    patterns:
    - raise
    - Exception
    - ValueError
    - TypeError
    - RuntimeError
    - OSError
    - ImportError
    public: true
    semantic_dimensions:
    - error_contract
    - output_format
    stability: stable
    test_priority: high
  python_public_api:
    description: Public Python module, class, function, method, and attribute behavior.
    exclude:
    - test/**
    - tests/**
    - '**/test_*.py'
    - '**/*_test.py'
    paths:
    - '**/*.py'
    public: true
    semantic_dimensions:
    - signature
    - input_contract
    - return_contract
    - error_contract
    - side_effect
    stability: stable
    test_priority: high
    visibility_rules:
    - Symbols in __all__ are public.
    - Module-level functions/classes without _ prefix are public unless documented
      internal.
    - Underscore-prefixed module-level symbols are internal by default.
  python_stdlib:
    description: Python standard library public API
    exclude:
    - Lib/test/**
    - Lib/**/test_*
    - Lib/**/tests/**
    paths:
    - Lib/**
    test_priority: high
    visibility_rules:
    - Symbols in __all__ are public
    - Functions/classes without _ prefix in __init__.py are public
    - Underscore-prefixed symbols (_internal) are NOT public API
  return_conventions:
    description: 'Python conventions that, if changed, are breaking:

      - None return vs raising exception

      - False vs None for falsy returns

      - Empty list/dict/string vs None

      - Integer 0 vs None

      '
    test_priority: high
  stable_abi:
    description: Limited API / Stable ABI
    paths:
    - Include/stable_abi.h
    - PC/python3dll.c
    patterns:
    - Py_LIMITED_API
    test_priority: high
  syscall_wrappers:
    description: User-space syscall wrappers, fallbacks, flags, errno, and retry behavior.
    patterns:
    - syscall
    - SYS_
    - __NR_
    - seccomp
    - clone3
    - openat2
    - statx
    - pidfd_
    - io_uring
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - error_contract
    - timeout_retry
    stability: stable
    test_priority: high
  tests:
    description: Test-only files. Use as reachability evidence, not as public API
      by itself.
    paths:
    - test/**
    - tests/**
    - t/**
    - spec/**
    - testing/**
    - '**/*_test.*'
    - '**/test_*'
    public: false
    test_priority: low
  user_visible_output:
    description: User-visible output, diagnostics, and log text.
    patterns:
    - printf
    - fprintf
    - puts
    - warn
    - error
    - die
    - log_
    - syslog
    public: true
    semantic_dimensions:
    - output_format
    - error_contract
    stability: semi_stable
    test_priority: medium
compatibility_types:
- API_SIGNATURE_CHANGE: Function, method, command, or exported interface signature
    changed
- ABI_CHANGE: Binary ABI, layout, exported symbol, enum, macro, or versioned symbol
    changed
- INPUT_CONTRACT_CHANGE: Accepted input, validation, range, required field, or flag
    semantics changed
- RETURN_CONTRACT_CHANGE: Return value, errno, exception, status, or output-buffer
    contract changed
- ERROR_EXCEPTION_CHANGE: Error code, exception type, diagnostic behavior, or failure
    path changed
- SIDE_EFFECT_CHANGE: Observable state, file, network, resource, cache, or permission
    side effect changed
- OUTPUT_FORMAT_CHANGE: CLI, log, protocol text, structured output, or file format
    changed
- PROC_SYS_OUTPUT_CHANGE: /proc, /proc/sys, or /sys output or attribute semantics
    changed
- SYSCALL_SEMANTIC_CHANGE: Syscall number, argument, flag, errno, compat, blocking,
    or timeout semantics changed
- IOCTL_NETLINK_ABI_CHANGE: ioctl command or netlink family/operation/attribute/policy
    ABI changed
- CONFIG_CLI_BEHAVIOR_CHANGE: CLI option, config key, environment variable, default,
    or parsing behavior changed
- RESOURCE_LIFETIME_CHANGE: Memory, fd, reference count, lock, object ownership, or
    cleanup lifetime changed
- PERFORMANCE_RESOURCE_SEMANTIC_CHANGE: Timeout, retry, limit, ordering, batching,
    or resource consumption semantics changed
- API_SIGNATURE_CHANGE: Function/method signature changes
- RETURN_CONTRACT_CHANGE: Return value semantics change
- ERROR_EXCEPTION_CHANGE: Exception type/message changes
- INPUT_CONTRACT_CHANGE: Input validation tightening
- SIDE_EFFECT_CHANGE: Observable side effect changes
- OUTPUT_FORMAT_CHANGE: Output/string formatting changes
description: CPython interpreter and standard library
ignore_patterns:
- generated files unless the generated artifact is the distributed interface
- purely internal refactors without exported, CLI, config, protocol, or test-reachable
  behavior
- '**/__pycache__/**'
- '**/*.pyc'
- test/**
- tests/**
- '**/test_*.py'
- '**/*_test.py'
- _ prefixed symbols unless explicitly exported
- static functions in .c files unless reachable from a public surface
- private/internal headers unless installed or included by public headers
- Lib/test/**
- Lib/**/test_*
- Lib/**/tests/**
- Tools/**
- Doc/**
- Misc/**
- Internal _ prefixed module-level symbols
- Private methods (__method__ except special methods that are documented)
language: c,python
name: cpython
profile_kind: base
profile_metadata:
  applied_variants: []
  profile_path: packages/cpython.yaml
  repo_facts:
    branch: HEAD
    path: /home/soong/pca_benchmark/opencode-results/pcat-cpython-deepseek-v4-flash-max-rerun-20260722/PCAT-P015/_worktrees/patched
    remotes:
    - https://github.com/python/cpython.git
  requested_profile: cpython
  resolved_extends:
  - default
  - python_base
  - c_family
  - cli_tool

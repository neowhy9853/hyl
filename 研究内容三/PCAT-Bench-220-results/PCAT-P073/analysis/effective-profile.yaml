analysis_policy:
  callgraph_after_findings_only: true
  evidence_required: true
  final_findings_only_confirmed: true
  semantic_dimensions:
  - signature
  - input_contract
  - return_contract
  - error_contract
  - side_effect
  - output_format
  - resource_lifetime
  - timeout_retry
api_surfaces:
  callbacks:
    description: Library callback function type changes
    patterns:
    - callback
    - cb_
    - _cb
    - '*callback*'
    public: true
    semantic_dimensions:
    - signature
    - resource_lifetime
    - side_effect
    stability: semi_stable
    test_priority: high
  cli:
    description: Command-line interface
    paths:
    - src/*main*
    - tools/**
    - cli/**
    patterns:
    - getopt
    - getopt_long
    - argparse
    - argp_parse
    - command
    - subcommand
    test_priority: high
  cli_options:
    description: CLI commands, options, parsing, defaults, exit codes, and output.
    paths:
    - src/*main*
    - src/**/main.*
    - tools/**
    - cli/**
    - builtin/**
    - cmd/**
    patterns:
    - getopt
    - getopt_long
    - argparse
    - argp_parse
    - parse_options
    - OPT_
    - command
    - subcommand
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - output_format
    - side_effect
    stability: stable
    test_priority: high
  cli_tools:
    description: LVM command-line syntax, options, and exit behavior
    paths:
    - tools/**
    patterns:
    - command
    - arg_
    - lvchange
    - vgchange
    - pvcreate
    test_priority: high
  config:
    description: Configuration file format and keys
    paths:
    - '**/*.conf*'
    - '**/*.cfg*'
    - '**/*.ini*'
    test_priority: medium
  config_files:
    description: Configuration formats, build options, and defaults.
    paths:
    - '**/*.conf*'
    - '**/*.cfg*'
    - '**/*.ini*'
    - '**/Kconfig*'
    - Makefile
    - CMakeLists.txt
    - meson_options.txt
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - output_format
    test_priority: medium
  config_keys:
    description: Configuration keys, parsing behavior, defaults, and diagnostics.
    paths:
    - '**/*config*'
    - '**/*.conf*'
    - '**/*.ini*'
    - '**/*.cfg*'
    patterns:
    - config
    - parse_config
    - read_config
    - git_config
    - repo_config
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - error_contract
    - side_effect
    stability: stable
    test_priority: high
  config_metadata:
    description: lvm.conf, profiles, metadata format, and parsing behavior
    paths:
    - lib/config/**
    - lib/format_text/**
    - lib/metadata/**
    patterns:
    - config
    - metadata
    - profile
    test_priority: high
  daemon_control:
    description: Runtime daemon control, metrics, and administration interfaces.
    paths:
    - src/dbus*
    - src/ubus*
    - src/*metrics*
    - daemon/**
    - daemons/**
    patterns:
    - dbus
    - ubus
    - sd_bus
    - metrics
    - admin
    - socket
    public: true
    semantic_dimensions:
    - input_contract
    - output_format
    - side_effect
    stability: stable
    test_priority: medium
  daemons:
    description: Daemon protocol and runtime behavior
    paths:
    - daemons/**
    patterns:
    - lvmetad
    - lvmpolld
    - dmeventd
    test_priority: medium
  docs:
    description: Documentation and release notes. Use for contract evidence only.
    paths:
    - doc/**
    - docs/**
    - Documentation/**
    - man/**
    - README*
    - CHANGELOG*
    - NEWS*
    public: false
    test_priority: low
  env_vars:
    description: Environment variable behavior
    patterns:
    - getenv
    - secure_getenv
    - setenv
    test_priority: medium
  environment_variables:
    description: Environment-variable configuration behavior.
    patterns:
    - getenv
    - secure_getenv
    - setenv
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - side_effect
    stability: stable
    test_priority: medium
  exported_symbols:
    description: Exported shared library symbols
    files:
    - '*.map'
    - '*.symver'
    - '*.sym'
    - '*.symbols'
    - '*.def'
    - '*.exports'
    patterns:
    - __declspec(dllexport)
    - __attribute__((visibility("default")))
    - EXPORT_SYMBOL
    - EXPORT_SYMBOL_GPL
    - EXPORT_SYMBOL_NS
    public: true
    semantic_dimensions:
    - signature
    - abi_symbol
    - return_contract
    stability: stable
    test_priority: high
  ioctl_netlink:
    description: ioctl command, netlink attribute, and kernel ABI consumers
    patterns:
    - ioctl
    - _IO
    - _IOR
    - _IOW
    - _IOWR
    - NETLINK_
    - nla_
    - genl_
    test_priority: high
  ioctl_netlink_consumers:
    description: ioctl and netlink ABI consumers or producers.
    patterns:
    - ioctl
    - _IO
    - _IOR
    - _IOW
    - _IOWR
    - NETLINK_
    - nla_
    - genl_
    public: true
    semantic_dimensions:
    - input_contract
    - abi_layout
    - return_contract
    stability: stable
    test_priority: high
  logging:
    description: Log output format (usually low test priority)
    patterns:
    - syslog
    - journal
    - log_
    - LOG_
    test_priority: low
  lvresize_mount_topology_input_contract:
    description: 'General lvextend/lvresize filesystem-resize and mount-topology input
      contract surface. Recall changes that can affect accepted mounted-LV states,
      alternate mount topologies, duplicate /proc/mounts or mtab entries, renamed
      devices, fs utility preconditions, early rejection paths, diagnostics, and metadata/resize
      side effects.

      '
    paths:
    - lib/device/filesystem.c
    - lib/device/filesystem.h
    - lib/metadata/lv_manip.c
    - test/shell/lvresize-fs.sh
    patterns:
    - fs_mount_state_is_misnamed
    - lv_resize
    - lvextend
    - lvresize
    - lvreduce
    - mount
    - getmntent
    - /proc/mounts
    - found_dir
    - found_dev
    - renamed
    - fs_get_info
    - fs_resize
    - resizefs
    public: true
    semantic_dimensions:
    - input_contract
    - mount_topology
    - cli_behavior
    - error_contract
    - side_effect
    stability: stable
    test_priority: high
  network_protocol:
    description: Network protocol request/response and capability behavior.
    paths:
    - src/*proto*
    - src/*http*
    - src/*dns*
    - src/*dhcp*
    - src/*ldap*
    - net/**
    - protocol/**
    patterns:
    - protocol
    - packet
    - query
    - answer
    - request
    - response
    - capability
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - output_format
    - timeout_retry
    - side_effect
    stability: stable
    test_priority: high
  persistence_state:
    description: Persistent or externally observable daemon state.
    patterns:
    - lease
    - cache
    - state
    - pidfile
    - database
    public: true
    semantic_dimensions:
    - side_effect
    - resource_lifetime
    - output_format
    stability: semi_stable
    test_priority: medium
  pkgconfig:
    description: pkg-config exposed API
    files:
    - '*.pc'
    - '*.pc.in'
    - '*Config.cmake'
    - '*Targets.cmake'
    public: true
    semantic_dimensions:
    - build_surface
    - dependency_contract
    stability: stable
    test_priority: high
  plugin_api:
    description: Plugin or module API
    paths:
    - modules/**
    - plugins/**
    patterns:
    - plugin
    - module_init
    - module_exit
    - hook
    - callback
    test_priority: high
  proc_sys_consumers:
    description: 'User-space parsing or generation of /proc, /proc/sys, or /sys text
      output.

      Field order, delimiter, unit, default value, missing-entry, and error-path

      changes can break scripts, monitoring, installers, and service managers.

      '
    patterns:
    - /proc/
    - /sys/
    - procfs
    - sysfs
    - sysctl
    - fscanf
    - sscanf
    - getline
    - readdir
    public: true
    semantic_dimensions:
    - output_format
    - input_contract
    - error_contract
    stability: semi_stable
    test_priority: medium
  protocol:
    description: Network protocol behavior
    paths:
    - src/*proto*
    - src/*http*
    - src/*dns*
    - src/*dhcp*
    - src/*ldap*
    test_priority: high
  public_headers:
    description: liblvm and device-mapper public/API-like headers
    exclude:
    - test/**
    - tests/**
    - t/**
    - private/**
    - internal/**
    paths:
    - include/**
    - src/include/**
    - lib*/include/**
    - api/**
    - '**/*.h'
    - lib/**
    patterns:
    - LVM
    - dm_
    - lv_
    - vg_
    - pv_
    public: true
    semantic_dimensions:
    - signature
    - abi_layout
    - input_contract
    - return_contract
    stability: stable
    test_priority: high
  struct_layout:
    description: 'ABI-sensitive definitions:

      - Struct layout (size, field order, field type)

      - Enum values

      - Macro definitions

      - Constants

      '
    paths:
    - include/**
    test_priority: high
  syscall_wrappers:
    description: 'C/C++ library wrappers or consumers of Linux system calls. Treat
      signature,

      errno, flag validation, blocking/retry, timeout, and fallback-path changes

      as compatibility candidates when reachable from public APIs or commands.

      '
    patterns:
    - syscall
    - SYS_
    - __NR_
    - seccomp
    - clone3
    - openat2
    - statx
    - pidfd_
    - io_uring
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - error_contract
    - timeout_retry
    stability: stable
    test_priority: high
  tests:
    description: Test-only files. Use as reachability evidence, not as public API
      by itself.
    paths:
    - test/**
    - tests/**
    - t/**
    - spec/**
    - testing/**
    - '**/*_test.*'
    - '**/test_*'
    public: false
    test_priority: low
  user_visible_output:
    description: User-visible output, diagnostics, and log text.
    patterns:
    - printf
    - fprintf
    - puts
    - warn
    - error
    - die
    - log_
    - syslog
    public: true
    semantic_dimensions:
    - output_format
    - error_contract
    stability: semi_stable
    test_priority: medium
compatibility_types:
- API_SIGNATURE_CHANGE: Function, method, command, or exported interface signature
    changed
- ABI_CHANGE: Binary ABI, layout, exported symbol, enum, macro, or versioned symbol
    changed
- INPUT_CONTRACT_CHANGE: Accepted input, validation, range, required field, or flag
    semantics changed
- RETURN_CONTRACT_CHANGE: Return value, errno, exception, status, or output-buffer
    contract changed
- ERROR_EXCEPTION_CHANGE: Error code, exception type, diagnostic behavior, or failure
    path changed
- SIDE_EFFECT_CHANGE: Observable state, file, network, resource, cache, or permission
    side effect changed
- OUTPUT_FORMAT_CHANGE: CLI, log, protocol text, structured output, or file format
    changed
- PROC_SYS_OUTPUT_CHANGE: /proc, /proc/sys, or /sys output or attribute semantics
    changed
- SYSCALL_SEMANTIC_CHANGE: Syscall number, argument, flag, errno, compat, blocking,
    or timeout semantics changed
- IOCTL_NETLINK_ABI_CHANGE: ioctl command or netlink family/operation/attribute/policy
    ABI changed
- CONFIG_CLI_BEHAVIOR_CHANGE: CLI option, config key, environment variable, default,
    or parsing behavior changed
- RESOURCE_LIFETIME_CHANGE: Memory, fd, reference count, lock, object ownership, or
    cleanup lifetime changed
- PERFORMANCE_RESOURCE_SEMANTIC_CHANGE: Timeout, retry, limit, ordering, batching,
    or resource consumption semantics changed
- API_SIGNATURE_CHANGE: Function prototype/visibility change
- ABI_CHANGE: Struct layout/enum/macro/exported symbol change
- INPUT_CONTRACT_CHANGE: Input validation change
- RETURN_CONTRACT_CHANGE: Return value/errno change
- ERROR_EXCEPTION_CHANGE: Error code/exception change
- SIDE_EFFECT_CHANGE: Observable side effect change
- OUTPUT_FORMAT_CHANGE: Output/formatting change
- PROC_SYS_OUTPUT_CHANGE: /proc, /proc/sys, or /sys visible output/attribute change
- SYSCALL_SEMANTIC_CHANGE: System call wrapper, errno, flag, or fallback semantic
    change
- IOCTL_NETLINK_ABI_CHANGE: ioctl command or netlink attribute ABI/semantic change
- CONFIG_CLI_BEHAVIOR_CHANGE: Configuration or CLI change
- RESOURCE_LIFETIME_CHANGE: Memory/fd/lock lifecycle change
- PERFORMANCE_RESOURCE_SEMANTIC_CHANGE: Performance/timeout/retry change
- API_SIGNATURE_CHANGE: Public liblvm/device-mapper signature change
- ABI_CHANGE: Struct, enum, macro, or exported symbol change
- INPUT_CONTRACT_CHANGE: CLI/config/metadata validation change
- RETURN_CONTRACT_CHANGE: Exit code or library return convention change
- ERROR_EXCEPTION_CHANGE: Error code/message behavior change
- CONFIG_CLI_BEHAVIOR_CHANGE: lvm command/config behavior change
- SIDE_EFFECT_CHANGE: Device, metadata, lock, daemon, or activation side effect change
- RESOURCE_LIFETIME_CHANGE: Device handle, lock, or metadata lifecycle change
description: LVM2 userspace tools, daemon APIs, metadata, and device-mapper behavior
ignore_patterns:
- generated files unless the generated artifact is the distributed interface
- purely internal refactors without exported, CLI, config, protocol, or test-reachable
  behavior
- static functions in .c files unless reachable from a public surface
- private/internal headers unless installed or included by public headers
- static functions (in .c files, not in public headers)
- tests/**
- t/**
- test/**
- '*_test.c'
- '*_test.cpp'
- examples/**
- tools/**
- scripts/**
- contrib/**
- doc/**
- man/**
- Internal/private headers
- '#ifdef DEBUG blocks'
- static helpers not reachable from tools/lib/daemons
language: c
name: lvm2
profile_kind: base
profile_metadata:
  applied_variants: []
  profile_path: packages/lvm2.yaml
  repo_facts:
    branch: HEAD
    path: /home/soong/pca_benchmark/output_dir_rerun/PCAT-P073/_worktrees/patched
    remotes:
    - https://github.com/lvmteam/lvm2
  requested_profile: lvm2
  resolved_extends:
  - c_project
  - cli_tool
  - daemon_network

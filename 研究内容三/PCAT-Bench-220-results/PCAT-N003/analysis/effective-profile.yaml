abi_breaking_changes:
- struct layout change (size, field order, field type)
- enum value change
- macro value change
- exported function signature change
- errno return value change
- NULL pointer handling change
- lock ordering change
- reference counting change
- memory lifecycle change
analysis_policy:
  callgraph_after_findings_only: true
  evidence_required: true
  final_findings_only_confirmed: true
  semantic_dimensions:
  - signature
  - input_contract
  - return_contract
  - error_contract
  - side_effect
  - output_format
  - resource_lifetime
  - timeout_retry
api_surfaces:
  bpf:
    description: BPF helper functions and verifier behavior
    paths:
    - kernel/bpf/**
    - include/uapi/linux/bpf.h
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - verifier_semantics
    stability: stable
    test_priority: high
  callbacks:
    description: Callback types and callback invocation semantics.
    patterns:
    - callback
    - cb_
    - _cb
    - '*callback*'
    public: true
    semantic_dimensions:
    - signature
    - resource_lifetime
    - side_effect
    stability: semi_stable
    test_priority: high
  config_files:
    description: Configuration formats, build options, and defaults.
    paths:
    - '**/*.conf*'
    - '**/*.cfg*'
    - '**/*.ini*'
    - '**/Kconfig*'
    - Makefile
    - CMakeLists.txt
    - meson_options.txt
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - output_format
    test_priority: medium
  debugfs:
    description: Debug filesystem (not stable ABI)
    patterns:
    - debugfs_create_file
    - debugfs_create_dir
    test_priority: low
  docs:
    description: Documentation and release notes. Use for contract evidence only.
    paths:
    - doc/**
    - docs/**
    - Documentation/**
    - man/**
    - README*
    - CHANGELOG*
    - NEWS*
    public: false
    test_priority: low
  dt_binding:
    description: Device tree binding documentation
    paths:
    - Documentation/devicetree/bindings/**
    test_priority: high
  environment_variables:
    description: Environment-variable configuration behavior.
    patterns:
    - getenv
    - secure_getenv
    - setenv
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - side_effect
    stability: stable
    test_priority: medium
  exported_symbols:
    description: Exported kernel symbols used by modules
    files:
    - '*.map'
    - '*.symver'
    - '*.sym'
    - '*.symbols'
    - '*.def'
    - '*.exports'
    patterns:
    - __declspec(dllexport)
    - __attribute__((visibility("default")))
    - EXPORT_SYMBOL
    - EXPORT_SYMBOL_GPL
    - EXPORT_SYMBOL_NS
    public: true
    semantic_dimensions:
    - signature
    - abi_symbol
    - return_contract
    - resource_lifetime
    - side_effect
    stability: stable
    test_priority: high
  ioctl:
    description: Device ioctl interface
    patterns:
    - .ioctl\s*=
    - unlocked_ioctl
    - compat_ioctl
    - _IO
    - _IOR
    - _IOW
    - _IOWR
    public: true
    semantic_dimensions:
    - input_contract
    - abi_layout
    - return_contract
    stability: stable
    test_priority: high
  ioctl_netlink_consumers:
    description: ioctl and netlink ABI consumers or producers.
    patterns:
    - ioctl
    - _IO
    - _IOR
    - _IOW
    - _IOWR
    - NETLINK_
    - nla_
    - genl_
    public: true
    semantic_dimensions:
    - input_contract
    - abi_layout
    - return_contract
    stability: stable
    test_priority: high
  kconfig:
    description: Kernel build configuration options
    paths:
    - '**/Kconfig*'
    test_priority: medium
  module_param:
    description: Module parameters
    patterns:
    - module_param
    - module_param_named
    - module_param_string
    - module_param_array
    test_priority: medium
  module_parameters:
    description: Kernel module parameter names, permissions, defaults, and parsing
      behavior.
    patterns:
    - module_param
    - module_param_named
    - module_param_string
    - module_param_array
    public: true
    semantic_dimensions:
    - input_contract
    - default_value
    - permission
    stability: stable
    test_priority: medium
  netlink:
    description: Netlink protocol interface, attributes, families, and policies
    paths:
    - net/netlink/**
    - include/net/netlink/**
    - include/uapi/linux/netlink/**
    patterns:
    - nla_policy
    - genl_family
    - genl_ops
    - nla_put
    - nla_parse
    public: true
    semantic_dimensions:
    - input_contract
    - abi_layout
    - return_contract
    - output_format
    stability: stable
    test_priority: high
  pkgconfig:
    description: Build metadata consumed by external projects.
    files:
    - '*.pc'
    - '*.pc.in'
    - '*Config.cmake'
    - '*Targets.cmake'
    public: true
    semantic_dimensions:
    - build_surface
    - dependency_contract
    stability: stable
    test_priority: high
  proc_sys_consumers:
    description: User-space parsers or generators for /proc, /proc/sys, or /sys text
      output.
    patterns:
    - /proc/
    - /sys/
    - procfs
    - sysfs
    - sysctl
    - fscanf
    - sscanf
    - getline
    - readdir
    public: true
    semantic_dimensions:
    - output_format
    - input_contract
    - error_contract
    stability: semi_stable
    test_priority: medium
  procfs:
    description: '/proc entries and text output. Treat field addition/removal, ordering,

      delimiter, unit, header, permission, missing-entry, and error behavior

      changes as compatibility candidates, especially for documented or widely

      scraped entries.

      '
    patterns:
    - proc_create
    - proc_create_data
    - proc_create_seq
    - proc_ops
    - single_open
    - seq_printf
    - seq_puts
    - seq_putc
    - seq_read
    - remove_proc_entry
    public: true
    semantic_dimensions:
    - output_format
    - permission
    - error_contract
    stability: semi_stable
    test_priority: medium
  public_headers:
    description: Public C/C++ headers and declarations.
    exclude:
    - test/**
    - tests/**
    - t/**
    - private/**
    - internal/**
    paths:
    - include/**
    - src/include/**
    - lib*/include/**
    - api/**
    - '**/*.h'
    public: true
    semantic_dimensions:
    - signature
    - abi_layout
    - input_contract
    - return_contract
    stability: stable
    test_priority: high
  syscall:
    description: 'System call interface and user-visible syscall tables. Changes to
      syscall

      number, argument validation, errno, flag semantics, copy_to/from_user

      behavior, compat handling, blocking, or timeout behavior are high-priority

      compatibility candidates.

      '
    paths:
    - kernel/**
    - fs/**
    - mm/**
    - net/**
    - ipc/**
    - include/uapi/asm-generic/unistd.h
    - arch/*/entry/syscalls/**
    patterns:
    - SYSCALL_DEFINE
    - COMPAT_SYSCALL_DEFINE
    - __SYSCALL
    - syscall.tbl
    - __NR_
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - error_contract
    - timeout_retry
    - side_effect
    stability: stable
    test_priority: high
  syscall_wrappers:
    description: User-space syscall wrappers, fallbacks, flags, errno, and retry behavior.
    patterns:
    - syscall
    - SYS_
    - __NR_
    - seccomp
    - clone3
    - openat2
    - statx
    - pidfd_
    - io_uring
    public: true
    semantic_dimensions:
    - input_contract
    - return_contract
    - error_contract
    - timeout_retry
    stability: stable
    test_priority: high
  sysctl:
    description: /proc/sys sysctl names, permissions, parsers, ranges, defaults, and
      output
    paths:
    - kernel/sysctl.c
    - fs/proc/**
    - net/**
    patterns:
    - register_sysctl
    - unregister_sysctl_table
    - ctl_table
    - proc_dointvec
    - proc_douintvec
    - proc_dostring
    - proc_dobool
    - proc_doulongvec_minmax
    public: true
    semantic_dimensions:
    - input_contract
    - output_format
    - permission
    - default_value
    stability: stable
    test_priority: high
  sysfs:
    description: '/sys attributes and show/store output. Treat value format, unit,
      accepted

      input, permission, attribute name, and error behavior changes as

      compatibility candidates.

      '
    patterns:
    - sysfs_create_file
    - sysfs_create_group
    - device_create_file
    - DEVICE_ATTR
    - DEVICE_ATTR_RO
    - DEVICE_ATTR_RW
    - __ATTR
    - sysfs_emit
    - sysfs_emit_at
    - kobj_attribute
    public: true
    semantic_dimensions:
    - input_contract
    - output_format
    - permission
    - error_contract
    stability: semi_stable
    test_priority: medium
  tests:
    description: Test-only files. Use as reachability evidence, not as public API
      by itself.
    paths:
    - test/**
    - tests/**
    - t/**
    - spec/**
    - testing/**
    - '**/*_test.*'
    - '**/test_*'
    public: false
    test_priority: low
  tracepoint:
    description: Tracepoint definitions
    patterns:
    - TRACE_EVENT
    - DECLARE_EVENT_CLASS
    - DEFINE_EVENT
    test_priority: medium
  tracepoints:
    description: Tracepoint name, field, and event format.
    patterns:
    - TRACE_EVENT
    - DECLARE_EVENT_CLASS
    - DEFINE_EVENT
    public: true
    semantic_dimensions:
    - output_format
    - abi_layout
    stability: semi_stable
    test_priority: medium
  uapi:
    description: "Userspace API headers \u2014 stable ABI"
    paths:
    - include/uapi/**
    - arch/*/include/uapi/**
    public: true
    semantic_dimensions:
    - signature
    - abi_layout
    - input_contract
    - return_contract
    - output_format
    stability: stable
    test_priority: high
compatibility_types:
- API_SIGNATURE_CHANGE: Function, method, command, or exported interface signature
    changed
- ABI_CHANGE: Binary ABI, layout, exported symbol, enum, macro, or versioned symbol
    changed
- INPUT_CONTRACT_CHANGE: Accepted input, validation, range, required field, or flag
    semantics changed
- RETURN_CONTRACT_CHANGE: Return value, errno, exception, status, or output-buffer
    contract changed
- ERROR_EXCEPTION_CHANGE: Error code, exception type, diagnostic behavior, or failure
    path changed
- SIDE_EFFECT_CHANGE: Observable state, file, network, resource, cache, or permission
    side effect changed
- OUTPUT_FORMAT_CHANGE: CLI, log, protocol text, structured output, or file format
    changed
- PROC_SYS_OUTPUT_CHANGE: /proc, /proc/sys, or /sys output or attribute semantics
    changed
- SYSCALL_SEMANTIC_CHANGE: Syscall number, argument, flag, errno, compat, blocking,
    or timeout semantics changed
- IOCTL_NETLINK_ABI_CHANGE: ioctl command or netlink family/operation/attribute/policy
    ABI changed
- CONFIG_CLI_BEHAVIOR_CHANGE: CLI option, config key, environment variable, default,
    or parsing behavior changed
- RESOURCE_LIFETIME_CHANGE: Memory, fd, reference count, lock, object ownership, or
    cleanup lifetime changed
- PERFORMANCE_RESOURCE_SEMANTIC_CHANGE: Timeout, retry, limit, ordering, batching,
    or resource consumption semantics changed
- API_SIGNATURE_CHANGE: Kernel exported function or UAPI prototype change
- ABI_CHANGE: UAPI struct layout, enum, macro, symbol, or binary ABI change
- INPUT_CONTRACT_CHANGE: Input validation or accepted flag/range change
- RETURN_CONTRACT_CHANGE: Return value or output buffer contract change
- ERROR_EXCEPTION_CHANGE: errno or diagnostic behavior change
- SIDE_EFFECT_CHANGE: Observable state, namespace, permission, or resource side effect
    change
- OUTPUT_FORMAT_CHANGE: Generic visible text/binary output change
- PROC_SYS_OUTPUT_CHANGE: /proc, /proc/sys, or /sys entry output/attribute change
- SYSCALL_SEMANTIC_CHANGE: syscall number, argument, errno, flag, compat, blocking,
    or timeout semantic change
- IOCTL_NETLINK_ABI_CHANGE: ioctl command or netlink family/attribute/policy ABI change
- CONFIG_CLI_BEHAVIOR_CHANGE: Kconfig, module parameter, or tool behavior change
- RESOURCE_LIFETIME_CHANGE: reference count, fd, memory, lock, or lifetime change
- PERFORMANCE_RESOURCE_SEMANTIC_CHANGE: timeout, retry, limit, or resource consumption
    semantic change
description: Linux Kernel 6.6 LTS branch
ignore_patterns:
- generated files unless the generated artifact is the distributed interface
- purely internal refactors without exported, CLI, config, protocol, or test-reachable
  behavior
- static functions in .c files unless reachable from a public surface
- private/internal headers unless installed or included by public headers
- tools/** unless analyzing the user-space tool itself
- samples/**
- scripts/**
- debugfs-only output unless documented or consumed by tests/tools
- static functions
- functions in .c files not in headers unless EXPORT_SYMBOL
- arch/*/kernel/** (unless in uapi)
- tools/** (userspace tools)
language: c
name: kernel_6_6
profile_kind: base
profile_metadata:
  applied_variants: []
  profile_path: packages/kernel_6_6.yaml
  repo_facts:
    branch: HEAD
    path: /home/soong/pca_benchmark/output_dir_rerun/PCAT-N003/_worktrees/patched
    remotes:
    - https://github.com/gregkh/linux.git
    - https://github.com/torvalds/linux.git
  requested_profile: kernel_6_6
  resolved_extends:
  - default
  - c_family
  - kernel_base

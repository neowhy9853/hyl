# Reusable daemon and network-protocol layer.

name: daemon_network
language: mixed
description: Daemon control, network protocol, metrics, and service behavior surface rules
profile_kind: base

api_surfaces:
  network_protocol:
    paths:
      - src/*proto*
      - src/*http*
      - src/*dns*
      - src/*dhcp*
      - src/*ldap*
      - net/**
      - protocol/**
    patterns:
      - protocol
      - packet
      - query
      - answer
      - request
      - response
      - capability
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - return_contract
      - output_format
      - timeout_retry
      - side_effect
    description: Network protocol request/response and capability behavior.

  daemon_control:
    paths:
      - src/dbus*
      - src/ubus*
      - src/*metrics*
      - daemon/**
      - daemons/**
    patterns:
      - dbus
      - ubus
      - sd_bus
      - metrics
      - admin
      - socket
    public: true
    stability: stable
    test_priority: medium
    semantic_dimensions:
      - input_contract
      - output_format
      - side_effect
    description: Runtime daemon control, metrics, and administration interfaces.

  persistence_state:
    patterns:
      - lease
      - cache
      - state
      - pidfile
      - database
    public: true
    stability: semi_stable
    test_priority: medium
    semantic_dimensions:
      - side_effect
      - resource_lifetime
      - output_format
    description: Persistent or externally observable daemon state.

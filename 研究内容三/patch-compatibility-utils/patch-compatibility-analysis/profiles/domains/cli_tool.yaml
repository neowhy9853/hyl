# Reusable CLI and configuration layer.

name: cli_tool
language: mixed
description: Command-line, config, output, and environment-variable surface rules
profile_kind: base

api_surfaces:
  cli_options:
    paths:
      - src/*main*
      - src/**/main.*
      - tools/**
      - cli/**
      - builtin/**
      - cmd/**
    patterns:
      - getopt
      - getopt_long
      - argparse
      - argp_parse
      - parse_options
      - OPT_
      - command
      - subcommand
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - return_contract
      - output_format
      - side_effect
    description: CLI commands, options, parsing, defaults, exit codes, and output.

  config_keys:
    paths:
      - '**/*config*'
      - '**/*.conf*'
      - '**/*.ini*'
      - '**/*.cfg*'
    patterns:
      - config
      - parse_config
      - read_config
      - git_config
      - repo_config
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - default_value
      - error_contract
      - side_effect
    description: Configuration keys, parsing behavior, defaults, and diagnostics.

  user_visible_output:
    patterns:
      - printf
      - fprintf
      - puts
      - warn
      - error
      - die
      - log_
      - syslog
    public: true
    stability: semi_stable
    test_priority: medium
    semantic_dimensions:
      - output_format
      - error_contract
    description: User-visible output, diagnostics, and log text.

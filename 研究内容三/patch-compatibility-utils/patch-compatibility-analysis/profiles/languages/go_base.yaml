# Reusable Go exported API, command, and error surface layer.

name: go_base
language: go
description: Go package, standard-library, command, interface, and error compatibility surface rules
profile_kind: language

api_surfaces:
  go_exported_api:
    paths:
      - '**/*.go'
    exclude:
      - '**/*_test.go'
      - '**/internal/**'
    public: true
    stability: stable
    test_priority: high
    visibility_rules:
      - Exported identifiers start with an uppercase letter.
      - Interfaces define behavioral contracts for implementors.
      - Unexported identifiers and internal packages are internal by default.
    semantic_dimensions:
      - signature
      - input_contract
      - return_contract
      - error_contract
    description: Exported Go functions, methods, types, interfaces, constants, and variables.

  go_errors:
    patterns:
      - errors.New
      - fmt.Errorf
      - error
      - Unwrap
      - Is(
      - As(
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - error_contract
      - return_contract
    description: Error type, sentinel value, wrapping, and comparison behavior.

  go_commands:
    paths:
      - cmd/**
      - src/cmd/**
    patterns:
      - flag.
      - os.Args
      - Exit
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - return_contract
      - output_format
    description: Go command-line tool options, output, and exit behavior.

ignore_patterns:
  - '**/*_test.go'
  - '**/internal/**'
  - testdata/**
  - unexported identifiers unless reachable from exported behavior

# Reusable Python public API, package, CLI, and exception surface layer.

name: python_base
language: python
description: Python package and standard-library compatibility surface rules
profile_kind: language

api_surfaces:
  python_public_api:
    paths:
      - '**/*.py'
    exclude:
      - test/**
      - tests/**
      - '**/test_*.py'
      - '**/*_test.py'
    public: true
    stability: stable
    test_priority: high
    visibility_rules:
      - Symbols in __all__ are public.
      - Module-level functions/classes without _ prefix are public unless documented internal.
      - Underscore-prefixed module-level symbols are internal by default.
    semantic_dimensions:
      - signature
      - input_contract
      - return_contract
      - error_contract
      - side_effect
    description: Public Python module, class, function, method, and attribute behavior.

  python_exceptions:
    patterns:
      - raise
      - Exception
      - ValueError
      - TypeError
      - RuntimeError
      - OSError
      - ImportError
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - error_contract
      - output_format
    description: Exception type, message, and failure-path compatibility.

  python_cli:
    paths:
      - '**/__main__.py'
      - bin/**
      - scripts/**
    patterns:
      - argparse
      - click
      - optparse
      - sys.argv
      - sys.exit
    public: true
    stability: stable
    test_priority: medium
    semantic_dimensions:
      - input_contract
      - return_contract
      - output_format
    description: Python command-line entrypoints and exit behavior.

ignore_patterns:
  - '**/__pycache__/**'
  - '**/*.pyc'
  - test/**
  - tests/**
  - '**/test_*.py'
  - '**/*_test.py'
  - _ prefixed symbols unless explicitly exported

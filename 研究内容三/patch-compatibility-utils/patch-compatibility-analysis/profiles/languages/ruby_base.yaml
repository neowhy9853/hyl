# Reusable Ruby public API, C extension API, exception, and CLI surface layer.

name: ruby_base
language: ruby
description: Ruby public method/class/module, C extension, exception, keyword, and CLI compatibility rules
profile_kind: language

api_surfaces:
  ruby_public_api:
    paths:
      - lib/**/*.rb
      - ext/**/*.rb
    public: true
    stability: stable
    test_priority: high
    visibility_rules:
      - Public methods are API unless marked :nodoc: or documented internal.
      - private/protected methods are internal by default.
      - Classes/modules in stdlib or public gems are public API.
    semantic_dimensions:
      - signature
      - input_contract
      - return_contract
      - error_contract
      - side_effect
    description: Ruby public methods, classes, modules, constants, and attributes.

  ruby_c_extension_api:
    paths:
      - include/ruby/**
      - ext/**/*.c
      - ext/**/*.h
    patterns:
      - rb_
      - ruby_
      - VALUE
      - ID
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - signature
      - abi_layout
      - resource_lifetime
    description: Ruby C extension API and ABI.

  ruby_exceptions:
    patterns:
      - raise
      - rescue
      - Exception
      - StandardError
      - RuntimeError
      - ArgumentError
      - TypeError
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - error_contract
    description: Exception hierarchy, type, message, and failure behavior.

  ruby_cli:
    paths:
      - ruby.c
      - bin/**
      - lib/optparse*
    public: true
    stability: stable
    test_priority: medium
    semantic_dimensions:
      - input_contract
      - return_contract
      - output_format
    description: Ruby command-line behavior and options.

ignore_patterns:
  - test/**
  - spec/**
  - sample/**
  - tool/**
  - benchmark/**
  - private/protected methods unless externally reachable
  - :nodoc: marked symbols

# Reusable C/C++ API and ABI surface layer.

name: c_family
language: c,cpp
description: Generic C/C++ public header, ABI, callback, syscall-wrapper, and build surface rules
profile_kind: base

api_surfaces:
  public_headers:
    paths:
      - include/**
      - src/include/**
      - lib*/include/**
      - api/**
      - '**/*.h'
    exclude:
      - test/**
      - tests/**
      - t/**
      - private/**
      - internal/**
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - signature
      - abi_layout
      - input_contract
      - return_contract
    description: Public C/C++ headers and declarations.

  exported_symbols:
    patterns:
      - __declspec(dllexport)
      - __attribute__((visibility("default")))
      - EXPORT_SYMBOL
      - EXPORT_SYMBOL_GPL
      - EXPORT_SYMBOL_NS
    files:
      - '*.map'
      - '*.symver'
      - '*.sym'
      - '*.symbols'
      - '*.def'
      - '*.exports'
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - signature
      - abi_symbol
      - return_contract
    description: Shared-library or module-exported symbols.

  pkgconfig:
    files:
      - '*.pc'
      - '*.pc.in'
      - '*Config.cmake'
      - '*Targets.cmake'
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - build_surface
      - dependency_contract
    description: Build metadata consumed by external projects.

  callbacks:
    patterns:
      - callback
      - cb_
      - _cb
      - '*callback*'
    public: true
    stability: semi_stable
    test_priority: high
    semantic_dimensions:
      - signature
      - resource_lifetime
      - side_effect
    description: Callback types and callback invocation semantics.

  environment_variables:
    patterns:
      - getenv
      - secure_getenv
      - setenv
    public: true
    stability: stable
    test_priority: medium
    semantic_dimensions:
      - input_contract
      - default_value
      - side_effect
    description: Environment-variable configuration behavior.

  syscall_wrappers:
    patterns:
      - syscall
      - SYS_
      - __NR_
      - seccomp
      - clone3
      - openat2
      - statx
      - pidfd_
      - io_uring
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - return_contract
      - error_contract
      - timeout_retry
    description: User-space syscall wrappers, fallbacks, flags, errno, and retry behavior.

  ioctl_netlink_consumers:
    patterns:
      - ioctl
      - _IO
      - _IOR
      - _IOW
      - _IOWR
      - NETLINK_
      - nla_
      - genl_
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - abi_layout
      - return_contract
    description: ioctl and netlink ABI consumers or producers.

  proc_sys_consumers:
    patterns:
      - /proc/
      - /sys/
      - procfs
      - sysfs
      - sysctl
      - fscanf
      - sscanf
      - getline
      - readdir
    public: true
    stability: semi_stable
    test_priority: medium
    semantic_dimensions:
      - output_format
      - input_contract
      - error_contract
    description: User-space parsers or generators for /proc, /proc/sys, or /sys text output.

ignore_patterns:
  - static functions in .c files unless reachable from a public surface
  - private/internal headers unless installed or included by public headers

# Git Profile

name: git
language: c
description: Git command-line tool, plumbing/porcelain commands, and libraries
extends:
  - c_project
  - cli_tool

variants:
  openeuler:
    detect:
      remotes:
        - '*atomgit.com/openeuler*'
    overlay:
      api_surfaces:
        downstream_packaging:
          paths:
            - '*.spec'
            - rpm/**
          public: true
          stability: semi_stable
          test_priority: medium
          description: Downstream packaging and integration behavior.

api_surfaces:
  commands:
    paths:
      - builtin/**
      - git.c
      - parse-options.c
    patterns:
      - cmd_
      - parse_options
      - OPT_
    test_priority: high
    description: Git CLI commands, options, and exit behavior

  config:
    paths:
      - config.c
      - builtin/**
    patterns:
      - git_config
      - repo_config
      - config_fn_t
    test_priority: high
    description: Git configuration keys and parsing semantics

  wire_protocol:
    paths:
      - protocol.c
      - pkt-line.c
      - upload-pack.c
      - fetch-pack.c
      - send-pack.c
      - remote-curl.c
    patterns:
      - packet_
      - protocol
      - capability
    test_priority: high
    description: Repository wire protocol and capability behavior

  public_library_headers:
    paths:
      - '*.h'
    exclude:
      - t/**
    test_priority: medium
    description: Headers used by Git builtins and external integrations

compatibility_types:
  - API_SIGNATURE_CHANGE: Command/helper signature visible to integrations
  - INPUT_CONTRACT_CHANGE: CLI/config/protocol input validation change
  - RETURN_CONTRACT_CHANGE: Exit code or helper return convention change
  - ERROR_EXCEPTION_CHANGE: die/error/warning behavior change
  - CONFIG_CLI_BEHAVIOR_CHANGE: Command option, config, or environment behavior change
  - OUTPUT_FORMAT_CHANGE: Porcelain/plumbing output format change
  - SIDE_EFFECT_CHANGE: Repository/index/worktree/network side effect change

ignore_patterns:
  - t/**
  - Documentation/**
  - contrib/**
  - templates/**
  - po/**
  - static helpers not reachable from cmd_* or protocol/config paths

# Golang Profile
# API surface definitions for Go toolchain compatibility analysis

name: golang
language: go
description: Go programming language toolchain and standard library
extends:
  - default
  - go_base
  - cli_tool

api_surfaces:
  # Exported API
  exported_api:
    description: Go exported identifiers (uppercase first letter)
    visibility_rules:
      - Exported identifiers (PascalCase) are public API
      - Unexported identifiers (camelCase) are internal
      - Interfaces define behavioral contracts
    test_priority: high

  # Standard library
  stdlib:
    paths:
      - src/runtime/**
      - src/net/**
      - src/crypto/**
      - src/encoding/**
      - src/io/**
      - src/fmt/**
      - src/os/**
      - src/sync/**
      - src/context/**
      - src/reflect/**
      - src/strings/**
      - src/builtin/**
    test_priority: high
    description: Go standard library

  # cmd/go
  cmd_go:
    paths:
      - src/cmd/go/**
    test_priority: high
    description: Go command behavior

  # Error handling
  errors:
    patterns:
      - errors.New
      - fmt.Errorf
      - error
      - sentinel error
    test_priority: high
    description: Error type, sentinel errors, error wrapping

  # Interfaces
  interfaces:
    description: |
      Go interface contracts:
      - Adding methods to an interface breaks all implementors
      - Changing interface method signatures
      - Removing exported interfaces
    test_priority: high

  # Reflection
  reflection:
    paths:
      - src/reflect/**
    test_priority: medium
    description: Reflection behavior changes

compatibility_types:
  - API_SIGNATURE_CHANGE: Exported function/type/method signature change
  - INTERFACE_CHANGE: Interface method set change
  - ERROR_EXCEPTION_CHANGE: Error type/value/wrapping change
  - INPUT_CONTRACT_CHANGE: Input validation tightening
  - SIDE_EFFECT_CHANGE: Observable side effects
  - OUTPUT_FORMAT_CHANGE: Output formatting change

ignore_patterns:
  - src/cmd/**/internal/**
  - "**/internal/**"
  - test data files
  - _test.go files (test code itself)
  - Unexported identifiers

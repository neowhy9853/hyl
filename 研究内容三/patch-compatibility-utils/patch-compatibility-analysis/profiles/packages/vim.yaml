# Vim Profile

name: vim
language: c
description: Vim editor core, Ex commands, options, and scripting interfaces
extends:
  - c_project
  - cli_tool

api_surfaces:
  ex_commands:
    paths:
      - src/**
    patterns:
      - ex_cmds
      - exarg_T
      - do_cmdline
      - cmdnames
    test_priority: high
    description: Ex command syntax and behavior

  options:
    paths:
      - src/option*
    patterns:
      - options
      - set_option
      - did_set
    test_priority: high
    description: User-visible option names, values, and validation

  vimscript:
    paths:
      - src/eval*
      - src/userfunc.c
      - src/vim9*
    patterns:
      - eval
      - typval_T
      - VimL
    test_priority: high
    description: Vimscript/Vim9 API, functions, and type semantics

  ui_behavior:
    paths:
      - src/**
      - runtime/**
    patterns:
      - autocmd
      - highlight
      - mapping
    test_priority: medium
    description: User-visible editor behavior

compatibility_types:
  - API_SIGNATURE_CHANGE: Public eval/command/internal API signature change
  - INPUT_CONTRACT_CHANGE: Command/function/option validation change
  - RETURN_CONTRACT_CHANGE: Vimscript return value change
  - ERROR_EXCEPTION_CHANGE: Error code/message behavior change
  - CONFIG_CLI_BEHAVIOR_CHANGE: Option, command, runtime, or CLI behavior change
  - OUTPUT_FORMAT_CHANGE: Message/output formatting change
  - SIDE_EFFECT_CHANGE: Buffer/window/state/autocmd side effect change

ignore_patterns:
  - src/testdir/**
  - runtime/doc/**
  - runtime/syntax/**
  - ci/**
  - tools/**
  - static helpers not reachable from commands/options/functions

# Apache httpd Profile

name: httpd
language: c
description: Apache HTTP Server core, modules, and utilities
extends:
  - c_project
  - cli_tool
  - daemon_network

api_surfaces:
  module_api:
    paths:
      - include/**
      - server/**
      - modules/**
    patterns:
      - AP_DECLARE
      - APR_DECLARE
      - AP_MODULE_DECLARE_DATA
      - ap_hook_
      - module AP_MODULE_DECLARE_DATA
    test_priority: high
    description: Public module API and hook contracts

  config_directives:
    patterns:
      - AP_INIT_
      - command_rec
      - cmd_parms
    test_priority: high
    description: Configuration directive parsing and behavior

  request_handling:
    paths:
      - server/**
      - modules/http/**
      - modules/proxy/**
      - modules/ssl/**
    patterns:
      - request_rec
      - ap_process
      - ap_run_
      - handler
    test_priority: high
    description: HTTP request, proxy, TLS, and response behavior

  cli:
    paths:
      - server/main.c
      - support/**
    test_priority: medium
    description: httpd and support utility command-line behavior

compatibility_types:
  - API_SIGNATURE_CHANGE: AP/APR public or module hook signature change
  - ABI_CHANGE: Public struct/enum/symbol ABI change
  - INPUT_CONTRACT_CHANGE: Request/config input validation change
  - RETURN_CONTRACT_CHANGE: Hook or handler return convention change
  - ERROR_EXCEPTION_CHANGE: HTTP status or error logging behavior change
  - CONFIG_CLI_BEHAVIOR_CHANGE: Directive or CLI behavior change
  - SIDE_EFFECT_CHANGE: Request, connection, cache, proxy, or TLS side effect change

ignore_patterns:
  - test/**
  - docs/**
  - manual/**
  - srclib/**
  - static helpers not reachable from directives/hooks

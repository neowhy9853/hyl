# NetworkManager Profile

name: networkmanager
language: c
description: NetworkManager daemon, libnm API, CLI, and D-Bus interfaces
extends:
  - c_project
  - cli_tool
  - daemon_network

api_surfaces:
  libnm_api:
    paths:
      - src/libnm-client-public/**
      - src/libnm-core-public/**
      - src/libnm/**
      - libnm/**
    patterns:
      - NM_AVAILABLE
      - NM_DEPRECATED
      - G_DECLARE_
    test_priority: high
    description: Public libnm and libnm-core API

  dbus_api:
    paths:
      - introspection/**
      - data/**/*.xml
      - src/core/**
    patterns:
      - org.freedesktop.NetworkManager
      - GDBus
      - dbus
    test_priority: high
    description: Stable D-Bus interfaces, properties, signals, and methods

  nmcli:
    paths:
      - clients/cli/**
    patterns:
      - nmc_
      - nmcli
    test_priority: high
    description: nmcli command-line behavior and output

  config:
    paths:
      - src/core/settings/**
      - data/**
    patterns:
      - keyfile
      - config
      - connection
    test_priority: high
    description: Connection profile and daemon configuration semantics

compatibility_types:
  - API_SIGNATURE_CHANGE: Public libnm or D-Bus signature change
  - ABI_CHANGE: GObject type, enum, property, signal, or symbol ABI change
  - INPUT_CONTRACT_CHANGE: Connection/config/input validation change
  - RETURN_CONTRACT_CHANGE: Return value, property, or D-Bus reply change
  - ERROR_EXCEPTION_CHANGE: NM error domain/code/message change
  - CONFIG_CLI_BEHAVIOR_CHANGE: nmcli, config, or connection behavior change
  - SIDE_EFFECT_CHANGE: Network state, device, DNS, or routing side effect change

ignore_patterns:
  - src/**/tests/**
  - clients/tests/**
  - tools/**
  - docs/**
  - static helpers not reachable from libnm/D-Bus/nmcli/config

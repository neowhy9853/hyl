# libxml2 Profile

name: libxml2
language: c
description: libxml2 XML parser and toolkit
extends:
  - c_project

api_surfaces:
  public_headers:
    paths:
      - include/libxml/**
    patterns:
      - XMLPUBFUN
      - XMLCALL
      - LIBXML_DLL_IMPORT
    test_priority: high
    description: Public libxml2 C API

  exported_symbols:
    files:
      - libxml2.syms
      - '*.map'
      - '*.def'
    test_priority: high
    description: Shared library symbol ABI

  parser_behavior:
    paths:
      - parser.c
      - tree.c
      - xmlreader.c
      - xmlwriter.c
      - xpath.c
      - valid.c
      - HTMLparser.c
    patterns:
      - xmlParse
      - xmlRead
      - xmlXPath
      - xmlValidate
    test_priority: high
    description: XML/HTML parsing, validation, XPath, and tree semantics

  error_handling:
    patterns:
      - xmlError
      - xmlRaiseError
      - xmlParserError
    test_priority: high
    description: Error code, warning, and recovery behavior

compatibility_types:
  - API_SIGNATURE_CHANGE: XMLPUBFUN signature or public type change
  - ABI_CHANGE: Struct layout, enum, macro, or exported symbol change
  - INPUT_CONTRACT_CHANGE: Parser input acceptance/validation change
  - RETURN_CONTRACT_CHANGE: Return pointer/int convention change
  - ERROR_EXCEPTION_CHANGE: xmlError code/message/recovery change
  - OUTPUT_FORMAT_CHANGE: Serialization or formatting change
  - RESOURCE_LIFETIME_CHANGE: xmlDoc/xmlNode ownership change

ignore_patterns:
  - test/**
  - result/**
  - doc/**
  - fuzz/**
  - runsuite.c
  - static functions not declared in include/libxml

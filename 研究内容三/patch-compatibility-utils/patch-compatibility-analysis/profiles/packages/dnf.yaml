# DNF Profile
# API surface definitions for DNF package manager compatibility analysis

name: dnf
language: python
description: DNF package manager (Python)
extends:
  - default
  - python_base
  - cli_tool

api_surfaces:
  # Python public API
  python_api:
    paths:
      - dnf/**
    exclude:
      - dnf/**/test*
      - dnf/**/tests/**
    test_priority: high
    description: DNF Python module API

  # CLI
  cli:
    paths:
      - dnf/cli/**
      - bin/dnf*
      - etc/dnf/**
    test_priority: high
    description: DNF CLI commands, options, output

  # Plugin API
  plugin_api:
    paths:
      - dnf/plugin/**
      - plugins/**
    patterns:
      - class Plugin
      - PLUGIN_API_VERSION
    test_priority: high
    description: DNF plugin interface

  # Configuration
  config:
    paths:
      - dnf/conf/**
      - etc/dnf/dnf.conf*
      - doc/*.conf*
    test_priority: medium
    description: Configuration keys and defaults

  # Exception/Return codes
  exceptions:
    patterns:
      - class.*Error
      - class.*Exception
      - raise
      - sys.exit
    test_priority: high
    description: Exception types and exit codes

  # Transaction/RPM API
  transaction_api:
    paths:
      - dnf/transaction*
      - dnf/rpm/**
    test_priority: high
    description: Transaction and RPM interaction API

compatibility_types:
  - API_SIGNATURE_CHANGE: Public function/method signature change
  - CLI_BEHAVIOR_CHANGE: CLI option/argument/output behavior change
  - CONFIG_BEHAVIOR_CHANGE: Configuration option behavior change
  - ERROR_EXCEPTION_CHANGE: Exception type or exit code change
  - INPUT_CONTRACT_CHANGE: Input validation change
  - RETURN_CONTRACT_CHANGE: Return value semantics change
  - PLUGIN_API_CHANGE: Plugin interface change

ignore_patterns:
  - dnf/**/test*
  - dnf/**/tests/**
  - tests/**
  - doc/**
  - _ prefixed symbols (internal)
  - Private methods

# HAProxy Profile

name: haproxy
language: c
description: HAProxy proxy, configuration, CLI, runtime API, and protocols
extends:
  - c_project
  - cli_tool
  - daemon_network

api_surfaces:
  config:
    paths:
      - src/cfgparse*.c
      - include/haproxy/cfgparse*.h
      - doc/configuration.txt
    patterns:
      - cfg_parse
      - bind_kw
      - srv_kw
      - proxy
    test_priority: high
    description: haproxy.cfg directive parsing and semantics

  runtime_api:
    paths:
      - src/stats.c
      - src/cli.c
      - include/haproxy/cli*.h
    patterns:
      - cli_kw
      - stats
      - Runtime API
    test_priority: high
    description: Admin socket, stats, and runtime API commands

  public_headers:
    paths:
      - include/haproxy/**
    test_priority: medium
    description: Headers used by extensions, filters, and internal modules

  protocol_behavior:
    paths:
      - src/mux_*.c
      - src/proto*.c
      - src/http*.c
      - src/ssl*.c
    patterns:
      - HTTP
      - TCP
      - SSL
      - QUIC
    test_priority: high
    description: Proxy protocol, HTTP/TCP/TLS/QUIC behavior

compatibility_types:
  - API_SIGNATURE_CHANGE: Public header, filter, or extension signature change
  - INPUT_CONTRACT_CHANGE: Config/runtime/protocol validation change
  - RETURN_CONTRACT_CHANGE: Command/protocol status behavior change
  - ERROR_EXCEPTION_CHANGE: Error log/status handling change
  - CONFIG_CLI_BEHAVIOR_CHANGE: Config directive or runtime API behavior change
  - OUTPUT_FORMAT_CHANGE: Stats/log/runtime output format change
  - SIDE_EFFECT_CHANGE: Routing, connection, stick-table, TLS, or health-check side effect

ignore_patterns:
  - reg-tests/**
  - tests/**
  - doc/**
  - examples/**
  - dev/**
  - static helpers not reachable from config/runtime/protocol paths

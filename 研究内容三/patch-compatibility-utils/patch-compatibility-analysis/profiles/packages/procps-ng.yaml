# procps-ng Profile

name: procps-ng
language: c
description: procps-ng command-line tools, procfs readers, and user-visible output formats
extends:
  - c_project
  - cli_tool

api_surfaces:
  ps_aix_format_output_contract:
    paths:
      - ps/sortformat.c
      - src/ps/sortformat.c
    patterns:
      - aix_format_parse
      - O_wrap
      - format_node
      - do_one_spec
      - search_aix_array
      - strcspn
      - buf
      - items
      - width
      - args
      - COMMAND
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - output_format
      - truncation
      - whitespace
      - input_contract
      - error_contract
    description: >
      General ps AIX-format parsing and output contract surface. Recall changes
      that can affect format descriptor parsing, literal text handling, field
      counting, format_node construction, column widths, whitespace,
      truncation, diagnostics, or COMMAND/%a display completeness for any
      ps -o/-eo format string.

  ps_cli_format:
    paths:
      - ps/**
      - src/ps/**
    patterns:
      - aix_format_parse
      - format
      - printf
      - snprintf
      - "%[A-Za-z]"
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - output_format
      - input_contract
      - error_contract
    description: ps format specifiers, AIX format parsing, field widths, spacing, and truncation

  procps_tools:
    paths:
      - src/**
      - pgrep/**
      - pkill/**
      - pwdx/**
      - skill/**
      - slabtop/**
      - sysctl/**
      - top/**
      - uptime/**
      - vmstat/**
      - w/**
      - watch/**
    patterns:
      - getopt
      - printf
      - procfs
      - "/proc"
    public: true
    stability: stable
    test_priority: medium
    semantic_dimensions:
      - output_format
      - input_contract
      - return_contract
    description: procps-ng shipped CLI tools and procfs-backed observable behavior

compatibility_types:
  - OUTPUT_FORMAT_CHANGE: ps/top/vmstat/watch visible fields, spacing, width, truncation, or ordering changed
  - INPUT_CONTRACT_CHANGE: CLI option, format specifier, or procfs input expectation changed
  - ERROR_EXCEPTION_CHANGE: Diagnostic text or exit-status behavior changed
  - CONFIG_CLI_BEHAVIOR_CHANGE: Command-line parsing, defaults, or option behavior changed
  - SIDE_EFFECT_CHANGE: Process selection, signal, or procfs read side effect changed

ignore_patterns:
  - tests/**
  - test/**
  - docs/**
  - po/**

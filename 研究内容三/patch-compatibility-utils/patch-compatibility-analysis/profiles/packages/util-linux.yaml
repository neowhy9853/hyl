# util-linux Profile

name: util-linux
language: c
description: util-linux command-line tools, libsmartcols output layout, libmount, blkid, and system utility behavior
extends:
  - c_project
  - cli_tool

api_surfaces:
  libsmartcols_cli_table_output_contract:
    paths:
      - libsmartcols/src/calculate.c
      - libsmartcols/src/column.c
      - libsmartcols/src/smartcolsP.h
      - sys-utils/lsblk.c
    patterns:
      - scols
      - count_cell_width
      - count_column_width
      - width_min
      - width_max
      - width_avg
      - width_deviation
      - truncate
      - lsblk
      - print
      - table
      - cell
      - empty
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - output_format
      - truncation
      - whitespace
      - empty_cell
      - table_layout
    description: >
      General libsmartcols-backed CLI table output contract surface. Recall
      changes that can affect table width accounting, per-cell statistics,
      truncation, alignment, empty or sparse cells, terminal/non-terminal
      rendering, and parseability for lsblk and other util-linux tools using
      libsmartcols.

  libsmartcols_output:
    paths:
      - libsmartcols/**
    patterns:
      - scols
      - column
      - width
      - truncate
      - print
      - table
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - output_format
      - input_contract
      - side_effect
    description: Table layout, column width, truncation, empty-cell, and terminal output behavior used by lsblk and related tools

  block_cli_tools:
    paths:
      - sys-utils/**
      - disk-utils/**
      - misc-utils/**
      - login-utils/**
      - text-utils/**
    patterns:
      - getopt
      - lsblk
      - mount
      - blkid
      - printf
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - output_format
      - input_contract
      - return_contract
      - side_effect
    description: Shipped util-linux CLI behavior, especially output parsed by scripts

  library_headers:
    paths:
      - include/**
      - lib*/src/**/*.h
      - lib*/src/*.h
    patterns:
      - extern
      - UL_
      - scols_
      - mnt_
      - blkid_
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - signature
      - abi
      - input_contract
      - return_contract
    description: libsmartcols/libmount/libblkid public or devel-package headers

compatibility_types:
  - OUTPUT_FORMAT_CHANGE: CLI/table text, spacing, truncation, empty output, or column order changed
  - INPUT_CONTRACT_CHANGE: CLI option, parser, table data, or library input expectation changed
  - RETURN_CONTRACT_CHANGE: Exit status, library return value, or output-buffer contract changed
  - ABI_CHANGE: Public header, struct, enum, symbol, or library ABI changed
  - CONFIG_CLI_BEHAVIOR_CHANGE: Command-line behavior or default changed
  - SIDE_EFFECT_CHANGE: Mount/block-device probing or stateful system behavior changed

ignore_patterns:
  - tests/**
  - test/**
  - Documentation/**
  - po/**

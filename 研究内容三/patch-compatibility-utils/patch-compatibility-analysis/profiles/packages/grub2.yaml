# grub2 Profile

name: grub2
language: c
description: GRUB bootloader and utilities
extends:
  - c_project
  - cli_tool

api_surfaces:
  module_api:
    paths:
      - include/grub/**
      - grub-core/**
    patterns:
      - GRUB_MOD_INIT
      - GRUB_MOD_FINI
      - grub_register_command
      - grub_extcmd
    test_priority: high
    description: GRUB module and command API

  boot_protocol:
    paths:
      - grub-core/loader/**
      - grub-core/kern/**
      - include/grub/**
    patterns:
      - multiboot
      - linux
      - efi
      - chainloader
    test_priority: high
    description: Boot protocol, loader, and platform behavior

  cli_commands:
    patterns:
      - grub_register_command
      - grub_register_extcmd
      - grub_command
    test_priority: high
    description: GRUB shell commands and options

  config:
    paths:
      - util/**
      - grub-core/normal/**
    patterns:
      - grub_script
      - grub_env
      - config
    test_priority: high
    description: grub.cfg parsing and environment semantics

compatibility_types:
  - API_SIGNATURE_CHANGE: Public grub_* or module command signature change
  - ABI_CHANGE: Module ABI, struct, enum, or exported symbol change
  - INPUT_CONTRACT_CHANGE: Boot/config input validation change
  - RETURN_CONTRACT_CHANGE: grub_err_t or command result change
  - ERROR_EXCEPTION_CHANGE: Error code/message behavior change
  - CONFIG_CLI_BEHAVIOR_CHANGE: Shell command or grub.cfg behavior change
  - SIDE_EFFECT_CHANGE: Boot state, disk, EFI, or environment side effect change

ignore_patterns:
  - tests/**
  - docs/**
  - po/**
  - util/grub.d/**
  - static helpers not reachable from commands/modules

# OpenLDAP Profile

name: openldap
language: c
description: OpenLDAP libraries, slapd server, overlays, tools, and LDAP protocol behavior
extends:
  - c_project
  - cli_tool
  - daemon_network

api_surfaces:
  libldap_api:
    paths:
      - include/**
      - libraries/libldap/**
      - libraries/liblber/**
    patterns:
      - LDAP_F
      - LDAP_P
      - ldap_
      - ber_
    test_priority: high
    description: libldap/liblber public C API and ABI

  protocol_behavior:
    paths:
      - servers/slapd/**
      - libraries/libldap/**
    patterns:
      - LDAP_REQ_
      - LDAP_RES_
      - filter
      - schema
      - bind
      - search
    test_priority: high
    description: LDAP protocol, controls, schema, filters, and result codes

  config_schema:
    paths:
      - servers/slapd/**
      - doc/man/**
    patterns:
      - olc
      - config
      - schema
      - slapd.conf
    test_priority: high
    description: cn=config, slapd.conf, schema, and overlay configuration

  tools:
    paths:
      - clients/tools/**
    patterns:
      - ldapsearch
      - ldapmodify
      - ldapadd
      - ldapdelete
    test_priority: medium
    description: LDAP client command-line behavior and output

compatibility_types:
  - API_SIGNATURE_CHANGE: libldap/liblber public signature change
  - ABI_CHANGE: Struct, enum, macro, or exported symbol change
  - INPUT_CONTRACT_CHANGE: LDAP/config/schema input validation change
  - RETURN_CONTRACT_CHANGE: LDAP result code or library return convention change
  - ERROR_EXCEPTION_CHANGE: Error code/message behavior change
  - CONFIG_CLI_BEHAVIOR_CHANGE: slapd/client tool config or CLI behavior change
  - OUTPUT_FORMAT_CHANGE: Tool/protocol text output format change
  - SIDE_EFFECT_CHANGE: Directory data, replication, overlay, or backend side effect change

ignore_patterns:
  - tests/**
  - doc/**
  - build/**
  - contrib/**
  - static helpers not reachable from libldap/slapd/tools/config

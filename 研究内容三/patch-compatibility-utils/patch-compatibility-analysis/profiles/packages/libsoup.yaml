# libsoup Profile

name: libsoup
language: c
description: GNOME libsoup HTTP client/server library
extends:
  - c_project
  - daemon_network

api_surfaces:
  public_headers:
    paths:
      - libsoup/**/*.h
    exclude:
      - libsoup/**/*-private.h
    patterns:
      - SOUP_AVAILABLE
      - SOUP_DEPRECATED
      - G_DECLARE_
      - G_DEFINE_
    test_priority: high
    description: Public GObject and C API declarations

  gir_introspection:
    files:
      - Soup-*.gir
      - Soup-*.typelib
    patterns:
      - introspection
      - gi-docgen
    test_priority: high
    description: API exposed to language bindings through GObject introspection

  http_semantics:
    paths:
      - libsoup/**
    patterns:
      - SoupMessage
      - SoupSession
      - SoupServer
      - status_code
      - headers
    test_priority: high
    description: HTTP request/response behavior and header/status handling

  pkgconfig:
    files:
      - libsoup-*.pc.in
      - libsoup-*.pc
    test_priority: high
    description: pkg-config exposed build interface

compatibility_types:
  - API_SIGNATURE_CHANGE: Public function/type/property signal signature change
  - ABI_CHANGE: GObject type, struct, enum, symbol, or pkg-config ABI change
  - INPUT_CONTRACT_CHANGE: Request/session/server input validation change
  - RETURN_CONTRACT_CHANGE: Return value or ownership convention change
  - ERROR_EXCEPTION_CHANGE: GError/status-code behavior change
  - SIDE_EFFECT_CHANGE: Network/session/cache/TLS side effect change
  - OUTPUT_FORMAT_CHANGE: Header/body formatting change

ignore_patterns:
  - tests/**
  - examples/**
  - docs/**
  - fuzzing/**
  - '*-private.h'
  - static functions not referenced by public API

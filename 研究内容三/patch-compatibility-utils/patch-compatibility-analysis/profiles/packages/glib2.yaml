# GLib Profile

name: glib2
language: c
description: GLib, GObject, GIO, and related GNOME platform libraries
extends:
  - c_project
  - daemon_network

api_surfaces:
  public_headers:
    paths:
      - glib/**/*.h
      - gobject/**/*.h
      - gio/**/*.h
    exclude:
      - '**/*private*.h'
    patterns:
      - GLIB_AVAILABLE
      - GOBJECT_AVAILABLE
      - GIO_AVAILABLE
      - G_DECLARE_
    test_priority: high
    description: Public GLib/GObject/GIO C API

  introspection:
    files:
      - GLib-*.gir
      - GObject-*.gir
      - Gio-*.gir
    test_priority: high
    description: API exposed through GObject introspection

  gobject_contracts:
    patterns:
      - G_DEFINE_TYPE
      - g_object_class_install_property
      - g_signal_new
      - GParamSpec
    test_priority: high
    description: Type, property, signal, and ownership contracts

  gio_behavior:
    paths:
      - gio/**
    patterns:
      - GFile
      - GSocket
      - GDBus
      - GSettings
    test_priority: high
    description: I/O, DBus, settings, and network behavior

compatibility_types:
  - API_SIGNATURE_CHANGE: Public GLib/GObject/GIO signature change
  - ABI_CHANGE: Type, struct, enum, macro, symbol, property, or signal ABI change
  - INPUT_CONTRACT_CHANGE: Validation/precondition change
  - RETURN_CONTRACT_CHANGE: Return value or ownership transfer change
  - ERROR_EXCEPTION_CHANGE: GError domain/code/message change
  - SIDE_EFFECT_CHANGE: Main-loop, I/O, DBus, settings, or thread side effect change
  - RESOURCE_LIFETIME_CHANGE: Refcount or ownership lifecycle change

ignore_patterns:
  - glib/tests/**
  - gobject/tests/**
  - gio/tests/**
  - fuzzing/**
  - docs/**
  - '**/*private*.h'
  - static helpers not reachable from public API

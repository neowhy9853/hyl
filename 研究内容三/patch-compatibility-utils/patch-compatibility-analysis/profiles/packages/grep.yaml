# GNU grep Profile

name: grep
language: c
description: GNU grep CLI, regular-expression parser, diagnostics, and output behavior
extends:
  - c_project
  - cli_tool

api_surfaces:
  regex_input_contract:
    paths:
      - src/**
      - lib/**
    patterns:
      - regex
      - compile
      - range
      - bracket
      - invalid
      - grep
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - error_contract
      - output_format
    description: >
      grep pattern syntax, regex validation, diagnostics, and match semantics.
      Recall changes to accepted regex grammar, bracket/range handling,
      locale-sensitive parsing, invalid-pattern diagnostics, exit behavior, and
      downstream script-visible matching.

  grep_cli_output:
    paths:
      - src/**
    patterns:
      - printf
      - error
      - emit
      - color
      - line
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - output_format
      - return_contract
      - input_contract
    description: >
      grep CLI options, exit status, stdout/stderr, and parseable output,
      including but not limited to regex parser changes. Recall changes that
      affect match prefixes, color/context output, binary-file handling,
      diagnostics, and script-visible return conventions.

compatibility_types:
  - INPUT_CONTRACT_CHANGE: Regex syntax, invalid range handling, option input, or file input acceptance changed
  - ERROR_EXCEPTION_CHANGE: Diagnostic text, invalid-pattern handling, or failure status changed
  - OUTPUT_FORMAT_CHANGE: Match output, context output, color, prefixes, or stderr changed
  - RETURN_CONTRACT_CHANGE: Exit status or match/no-match/error convention changed
  - CONFIG_CLI_BEHAVIOR_CHANGE: CLI option behavior or default changed

ignore_patterns:
  - tests/**
  - doc/**
  - po/**

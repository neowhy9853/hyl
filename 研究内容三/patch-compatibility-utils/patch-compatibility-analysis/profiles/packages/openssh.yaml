# OpenSSH Profile

name: openssh
language: c
description: OpenSSH client/server, scp/sftp/ssh CLI, config, and wire-protocol behavior
extends:
  - c_project
  - cli_tool
  - daemon_network

api_surfaces:
  scp_sftp_cli:
    paths:
      - scp.c
      - sftp.c
      - sftp-client.c
      - readconf.c
      - misc.c
    patterns:
      - scp
      - sftp
      - legacy
      - protocol
      - getopt
      - options
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - input_contract
      - side_effect
      - output_format
      - error_contract
    description: >
      scp/sftp command-line behavior, file-transfer protocol selection,
      remote path parsing, transfer side effects, interoperability
      requirements, compatibility fallbacks, and diagnostics.

  ssh_config_protocol:
    paths:
      - ssh.c
      - sshconnect*.c
      - readconf.c
      - servconf.c
      - kex*.c
      - packet.c
      - channels.c
    patterns:
      - option
      - protocol
      - kex
      - cipher
      - config
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - config
      - input_contract
      - side_effect
      - protocol
    description: >
      SSH CLI/config and wire-protocol behavior visible to clients and servers,
      including but not limited to defaults, authentication, key exchange,
      channel behavior, file-transfer protocol selection, and compatibility
      fallbacks.

compatibility_types:
  - CONFIG_CLI_BEHAVIOR_CHANGE: ssh/scp/sftp option, config, default, or path parsing behavior changed
  - SIDE_EFFECT_CHANGE: Transfer protocol, remote file operation, authentication, or host state effect changed
  - INPUT_CONTRACT_CHANGE: Accepted remote path, config key, key format, or option input changed
  - ERROR_EXCEPTION_CHANGE: Diagnostic, disconnect reason, or failure status changed
  - OUTPUT_FORMAT_CHANGE: CLI output, progress, or stderr changed
  - RETURN_CONTRACT_CHANGE: Exit status or protocol result changed

ignore_patterns:
  - regress/**
  - contrib/**
  - openbsd-compat/regress/**

# rsyslog Profile

name: rsyslog
language: c
description: rsyslog daemon, modules, config language, and log output behavior
extends:
  - c_project
  - cli_tool
  - daemon_network

api_surfaces:
  module_api:
    paths:
      - runtime/**
      - plugins/**
    patterns:
      - BEGINmodInit
      - CODESTART
      - MODULE_TYPE_
      - modInit
    test_priority: high
    description: Input/output/parser module API

  config_language:
    paths:
      - grammar/**
      - runtime/**conf**
      - plugins/**
    patterns:
      - cnfparam
      - config
      - RainerScript
    test_priority: high
    description: rsyslog.conf and RainerScript parsing semantics

  output_format:
    paths:
      - runtime/template.c
      - plugins/om*/**
    patterns:
      - template
      - msg
      - property
    test_priority: high
    description: Log template, property, and output formatting behavior

  daemon_interfaces:
    paths:
      - tools/**
      - plugins/im*/**
    patterns:
      - im
      - om
      - mm
    test_priority: medium
    description: Daemon input/output module runtime behavior

compatibility_types:
  - API_SIGNATURE_CHANGE: Module API or public runtime signature change
  - ABI_CHANGE: Plugin ABI, struct, enum, macro, or symbol change
  - INPUT_CONTRACT_CHANGE: Config/message validation change
  - RETURN_CONTRACT_CHANGE: Module return or status behavior change
  - ERROR_EXCEPTION_CHANGE: Error/action retry behavior change
  - CONFIG_CLI_BEHAVIOR_CHANGE: Config directive or daemon option behavior change
  - OUTPUT_FORMAT_CHANGE: Log/template output format change
  - SIDE_EFFECT_CHANGE: Queue, retry, file/network output side effect change

ignore_patterns:
  - tests/**
  - doc/**
  - packaging/**
  - contrib/**
  - static helpers not reachable from modules/config/output paths

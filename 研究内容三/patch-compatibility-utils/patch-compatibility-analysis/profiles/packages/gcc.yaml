# GCC Profile

name: gcc
language: c,cpp
description: GCC driver, libstdc++ public headers, ABI, diagnostics, and compile-time contract behavior
extends:
  - c_project
  - cli_tool

api_surfaces:
  libstdcxx_public_headers:
    paths:
      - libstdc++-v3/include/**
      - libstdc++-v3/config/**
    patterns:
      - std::
      - namespace std
      - _GLIBCXX_VISIBILITY
      - "#include"
      - template
    public: true
    stability: stable
    test_priority: high
    semantic_dimensions:
      - signature
      - input_contract
      - side_effect
      - compile_contract
    description: >
      libstdc++ headers shipped to downstream C++ code, including but not
      limited to transitive includes, public template contracts, namespace std
      declarations, constexpr/type-trait dependencies, diagnostics, and
      template-instantiation side effects visible at compile time.

  gcc_driver_diagnostics:
    paths:
      - gcc/**
      - gcc/cp/**
      - gcc/c-family/**
    patterns:
      - diagnostic
      - warning
      - error
      - option
      - lang_hooks
    public: true
    stability: stable
    test_priority: medium
    semantic_dimensions:
      - input_contract
      - error_contract
      - output_format
    description: >
      GCC command-line options, diagnostics, language acceptance, and compile
      output, including but not limited to source/header acceptance,
      dependency visibility, defaults, and generated metadata.

compatibility_types:
  - INPUT_CONTRACT_CHANGE: Accepted source, header dependencies, language mode, option, or template contract changed
  - SIDE_EFFECT_CHANGE: Transitive include, instantiation, generated code, or build side effect changed
  - API_SIGNATURE_CHANGE: Public libstdc++ function/class/template signature changed
  - ABI_CHANGE: libstdc++ ABI, symbol, layout, or version changed
  - ERROR_EXCEPTION_CHANGE: Compiler diagnostic or failure mode changed
  - CONFIG_CLI_BEHAVIOR_CHANGE: GCC driver option or default changed
  - OUTPUT_FORMAT_CHANGE: Diagnostic text or generated metadata output changed

ignore_patterns:
  - gcc/testsuite/**
  - libstdc++-v3/testsuite/**
  - contrib/**
